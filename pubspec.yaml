name: flutter_startup_metrics
description: >-
  Measures Flutter cold start from OS process start to the first frame actually
  rasterized, with a phase breakdown. Reports the numbers; sends them nowhere.
version: 0.1.0
homepage: https://github.com/brunovsiqueira/flutter_startup_metrics
repository: https://github.com/brunovsiqueira/flutter_startup_metrics
issue_tracker: https://github.com/brunovsiqueira/flutter_startup_metrics/issues
topics:
  - performance
  - monitoring
  - startup
  - metrics

environment:
  sdk: ^3.7.2
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.brunosiqueira.flutter_startup_metrics
        pluginClass: FlutterStartupMetricsPlugin
      ios:
        pluginClass: FlutterStartupMetricsPlugin
