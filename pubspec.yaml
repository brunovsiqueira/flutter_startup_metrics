name: flutter_startup_metrics
description: >-
  Measure Flutter app startup time and cold start in production: time to initial
  display (TTID), time to full display (TTFD), and a phase breakdown. Works in
  release builds.
version: 0.1.1
homepage: https://github.com/brunovsiqueira/flutter_startup_metrics
license: MIT
repository: https://github.com/brunovsiqueira/flutter_startup_metrics
issue_tracker: https://github.com/brunovsiqueira/flutter_startup_metrics/issues
topics:
  - startup
  - performance
  - monitoring
  - observability
  - metrics

environment:
  sdk: ^3.7.2
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.brunosiqueira.flutter_startup_metrics
        pluginClass: FlutterStartupMetricsPlugin
      ios:
        pluginClass: FlutterStartupMetricsPlugin
